[project]
name = "fraudlens"
version = "0.1.0"
description = "FraudLens AI: spot the warning signs before you pay"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Team Vodka" }]
dependencies = [
  "flet==1.0.0",
  "httpx>=0.27",
]

[tool.flet]
org = "com.fraudlens"
product = "FraudLens"
company = "FraudLens"
copyright = "Copyright (C) 2026 FraudLens team"

[tool.flet.app]
path = "src"

[tool.flet.android]
# Allow plain-http calls to a laptop backend during the hackathon demo.
# Remove once the backend is deployed behind HTTPS.
android_manifest_application_attributes = { usesCleartextTraffic = "true" }

[tool.flet.android.permission]
"android.permission.INTERNET" = true

[dependency-groups]
dev = ["flet[all]==1.0.0"]
